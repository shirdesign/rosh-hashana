<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ראש השנה אצל שירת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;800&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --ink:#2A2119; --surface:#FFFFFF; --line:#E3D9C9;
  --muted:#8A7B67; --plum:#6B3C52; --leaf:#4E7A55; --honey:#C08A2E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Assistant',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:70px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

header{padding:34px 0 22px;text-align:center;border-bottom:1px solid var(--line);margin-bottom:20px}
header h1{font-family:'Frank Ruhl Libre',serif;font-weight:800;font-size:38px;line-height:1.1;letter-spacing:-.01em}
header p{color:var(--muted);font-size:14px;font-weight:300;margin-top:8px}

.tabs{display:flex;gap:6px;margin-bottom:18px;position:sticky;top:0;background:var(--bg);
  padding:10px 0;z-index:5}
.tab{flex:1;background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;
  font-size:15px;padding:10px 4px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--plum);border-color:var(--plum);color:#fff;font-weight:600}

.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 16px 10px;margin-bottom:14px}
.group h2{font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:21px;margin-bottom:2px}
.group .meta{color:var(--muted);font-size:13px;font-weight:300;margin-bottom:12px}
.group .meta b{color:var(--leaf);font-weight:600}

.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-of-type{border-bottom:none}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;font-size:14px;color:#fff}
.row.done .box{background:var(--leaf);border-color:var(--leaf)}
.row.done .t{color:var(--muted);text-decoration:line-through}
.t{font-size:16px;flex:1}
.who{font-size:12px;color:var(--plum);background:#F3EAEE;padding:3px 10px;border-radius:999px;white-space:nowrap}
.x{background:none;border:none;color:var(--line);font-size:19px;cursor:pointer;padding:0 4px}
.row:hover .x{color:var(--muted)}

.add{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.add input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-family:inherit;font-size:15px;color:var(--ink)}
.add input.w{flex:0 0 96px}
.add button{background:var(--honey);border:none;color:#fff;font-family:inherit;font-weight:600;
  font-size:15px;padding:10px 18px;border-radius:10px;cursor:pointer}

.newgroup{display:flex;gap:8px;margin:6px 0 20px}
.newgroup input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;font-family:inherit;font-size:15px}
.newgroup button{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  font-family:inherit;font-size:15px;padding:11px 16px;border-radius:10px;cursor:pointer}

.state{text-align:center;color:var(--muted);font-size:14px;padding:40px 0;line-height:1.7}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px;text-align:center;font-size:13px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ראש השנה</h1>
    <p>מי מכין מה · מה עוד חסר · רשימת קניות</p>
  </header>
  <div class="tabs">
    <button class="tab on" data-tab="dish">התפריט</button>
    <button class="tab" data-tab="task">הכנות</button>
    <button class="tab" data-tab="shop">קניות</button>
  </div>
  <div id="app"><div class="state">טוען…</div></div>
</div>
<div class="bar" id="bar">מתחבר…</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const sb = createClient(
  'https://uhuqeeewycpfrxiodmzz.supabase.co',
  'sb_publishable_ORry7BEfcGwEoXxd13ZDNQ_DgKkuFpI'
);

let tab = 'dish', items = [];
const app = document.getElementById('app'), bar = document.getElementById('bar');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  const { data, error } = await sb.from('chag_items').select('*').order('meal').order('sort');
  if (error) { bar.textContent = 'שגיאת חיבור — רעננו את הדף'; return; }
  items = data; render();
  bar.textContent = 'משותף לכולם · כל שינוי נשמר מיד';
}

function render() {
  const mine = items.filter(i => i.kind === tab);
  if (!mine.length) {
    app.innerHTML = `<div class="state">אין כאן עדיין כלום.<br>הוסיפו פריט ראשון למטה.</div>${newGroup()}`;
    return;
  }
  const groups = {};
  mine.forEach(i => { (groups[i.meal] ||= []).push(i); });
  app.innerHTML = Object.entries(groups).map(([meal, list]) => {
    const done = list.filter(x => x.done).length;
    const [title, ...rest] = meal.split(' · ');
    return `<section class="group">
      <h2>${esc(title)}</h2>
      <div class="meta">${rest.length ? esc(rest.join(' · ')) + ' — ' : ''}<b>${done} מתוך ${list.length}</b></div>
      ${list.map(i => `
        <div class="row ${i.done ? 'done' : ''}" data-id="${i.id}">
          <div class="box">${i.done ? '✓' : ''}</div>
          <div class="t">${esc(i.title)}</div>
          ${i.who ? `<span class="who">${esc(i.who)}</span>` : ''}
          <button class="x" data-del="${i.id}" aria-label="מחיקה">×</button>
        </div>`).join('')}
      <div class="add">
        <input placeholder="${tab === 'shop' ? 'מה לקנות' : 'מנה'}" data-t="${esc(meal)}" maxlength="60">
        ${tab === 'dish' ? `<input class="w" placeholder="מי מכין" data-w="${esc(meal)}" maxlength="16">` : ''}
        <button data-add="${esc(meal)}">הוספה</button>
      </div>
    </section>`;
  }).join('') + newGroup();
}

const newGroup = () => `<div class="newgroup">
  <input id="ng" placeholder="${tab === 'shop' ? 'קטגוריה חדשה — למשל ירקות' : 'ארוחה או קטגוריה חדשה'}" maxlength="70">
  <button id="ngb">הוספה</button></div>`;

app.addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    const id = del.dataset.del;
    items = items.filter(i => i.id !== id); render();
    await sb.from('chag_items').delete().eq('id', id);
    return;
  }
  const add = e.target.closest('[data-add]');
  if (add) {
    const meal = add.dataset.add;
    const ti = app.querySelector(`[data-t="${CSS.escape(meal)}"]`);
    const wi = app.querySelector(`[data-w="${CSS.escape(meal)}"]`);
    const title = ti?.value.trim(); if (!title) return;
    const row = { kind: tab, meal, title, who: wi?.value.trim() || '', sort: 99 };
    const { data } = await sb.from('chag_items').insert(row).select().single();
    if (data) { items.push(data); render(); }
    return;
  }
  if (e.target.id === 'ngb') {
    const v = document.getElementById('ng')?.value.trim(); if (!v) return;
    const { data } = await sb.from('chag_items')
      .insert({ kind: tab, meal: v, title: 'פריט ראשון', sort: 1 }).select().single();
    if (data) { items.push(data); render(); }
    return;
  }
  const row = e.target.closest('.row');
  if (row) {
    const it = items.find(i => i.id === row.dataset.id); if (!it) return;
    it.done = !it.done; render();
    await sb.from('chag_items').update({ done: it.done }).eq('id', it.id);
  }
});

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); tab = b.dataset.tab; render();
}));

sb.channel('chag').on('postgres_changes',
  { event: '*', schema: 'public', table: 'chag_items' }, load).subscribe();

load();
</script>
</body>
</html>
